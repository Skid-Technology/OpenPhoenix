# ===========================================================================
#  Phoenix — menus.yml   ·   modern set
# 
#  Written in place of the default set on 1.16 and newer, where hex and
#  gradients render. Same wording and layout as the default; deeper colour.
# 
#  REQUIRES  mini-message: true  in config.yml, which the plugin turns on for
#  you when it writes this file. Without it the <gradient:...> tags below are
#  printed rather than parsed.
# 
#  THREE KEYS RECOLOUR THE NETWORK — global.yml, under network.colors:
#      main       &#FF3B6B   the subject of the sentence: names and values
#      secondary  &#E91E63   structure: the lore rail, bullets, marks
#      middle     &#C9C4C6   body prose
#  The literal hex below is the supporting palette and is not themed:
#      #F5F1F2 bright   #8A7F84 muted    #5A4A50 rail
#      #4ADE80 success  #FBBF24 caution  #7DD3FC staff channel
#  Gradients carry their own hex too, so they do not follow the three keys.
# 
#  MARKS   ✓ done    ✗ refused or issued    ⚑ needs attention
#          ● list row    ┃ lore rail    » action or breadcrumb
# ===========================================================================

general:
  # The buttons and lines the native forms share.
  # Forms have no pages of their own, so these move through the list.
  form:
    close: "<muted>Close"
    back: "<muted>« Back"
    next: "<middle>Next <rail><page>/<pages>"
    previous: "<middle>Back <rail><page>/<pages>"
    showing: "<muted><from>-<to> of <total>"

    # How a setting reads on a form. A button has no lore to carry its state,
    # so the state is drawn into the label itself.
    toggle-on: "<#4ADE80>■ <bright><name>"
    toggle-off: "<rail>■ <bright><name>"
    option: "<#FBBF24>■ <bright><name><muted>: <bright><option>"
  next-page-slot:
    material: "SKULL_ITEM"
    durability: 3
    head: true
    head-texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMTliZjMyOTJlMTI2YTEwNWI1NGViYTcxM2FhMWIxNTJkNTQxYTFkODkzODgyOWM1NjM2NGQxNzhlZDIyYmYifX19"
    name: "<main><bold>Next</bold> <rail><page>/<pages>"
    lore:
      - ""
      - "<muted>Right click to view all pages."
  previous-page-slot:
    material: "SKULL_ITEM"
    durability: 3
    head: true
    head-texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmQ2OWUwNmU1ZGFkZmQ4NGU1ZjNkMWMyMTA2M2YyNTUzYjJmYTk0NWVlMWQ0ZDcxNTJmZGM1NDI1YmMxMmE5In19fQ=="
    name: "<main><bold>Back</bold> <rail><page>/<pages>"
    lore:
      - ""
      - "<muted>Right click to view all pages."
  fill-slot:
    material: "STAINED_GLASS_PANE"
    durability: 15
  back-slot:
    material: "BED"
    durability: 0
    name: "<main><bold>Back</bold>"
    lore:
      - ""
      - "<#4ADE80>» <middle>Click to go back."
  filters-slot:
    name: "<main><bold>Filters</bold>"
    material: "HOPPER"
    slot: 4
    selector: " <main>»"
    enabled-filter: " <#4ADE80>✓ <middle><filter>"
    disabled-filter: " <rail>✗ <muted><filter>"
    lore:
      - "<filters>"
      - ""
      - "<#4ADE80>» <middle>Left/Right click to scroll."
      - "<main>» <middle>Middle click to select."


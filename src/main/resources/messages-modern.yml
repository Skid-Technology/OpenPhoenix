    - "<middle>Name: <main><name>"
    - "<middle>Last Seen: <main><lastSeen>"
    - "<middle>Last Location: <main><country> <muted>(<isp>)"
    - ""
    - "<score>"
    - "<matching>"
    - "<punishments>"
    - "<subnetMatch>"

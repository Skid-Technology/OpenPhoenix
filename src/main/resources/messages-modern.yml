    - ""
    - "<name><middle>'s Matching IP Info <main>(<amount>)<middle>:"
    - " <secondary>● <middle>Logins: <main><logins>"
    - " <secondary>● <middle>First Login: <main><firstLogin>"
    - " <secondary>● <middle>Last Login: <main><lastLogin>"
  subnet-only-match:
    - ""
    - "<main>The IPs of this player do not match,"
    - "<main>however the subnet does match!"
  ip-matching: "<#4ADE80>✓ <middle>Currently matching <main><player>"
  ip-not-matching: "<main>✗ <middle>Currently not matching <main><player>"
  punishment-matching: "<#4ADE80>✓ <middle><type> currently matching <main><player>"
  punishment-not-matching: "<main>✗ <middle><type> currently not matching <main><player>"

  # Header above each confidence group in /alts. <tier> and <amount> placeholders.
  group-header: "<tier> <muted>(<amount>):"

  # Rendered where <score> appears. Placeholders: <score>, <tier>,
  # <sharedAddresses>, <independentSubnets>, <lastSharedLogin>, <firstLinked>, <lastEvaluated>.
  # Lines with <lastSharedLogin> are dropped when the pair never shared an address.
  score-format:
    - "<middle>Confidence: <main><score>% <muted>(<tier><muted>)"
    - "<middle>Shared: <main><sharedAddresses> <muted>address(es) across <main><independentSubnets> <muted>subnet(s)"
    - "<middle>Last shared login: <main><lastSharedLogin>"
    - "<middle>First linked: <main><firstLinked> <muted>- last checked <main><lastEvaluated>"
  no-score: "<middle>Confidence: <muted>not scored yet"

  # Appended to the name where <sibling> appears when the link is trusted.
  trusted-tag: " <muted>(Trusted)"

  # Extra line under the score when the link is trusted.
  trusted-line: "<muted>Pinned as trusted - never enforces."
  disabled: "<main>✗ <middle>Alts are disabled on this server."
  status:
    blacklist:
      name: "<secondary>Blacklist"
      color: "<secondary>"
    banned:
      name: "<main>Banned"
      color: "<main>"
    muted-online:
      name: "<bright><italic>Muted</italic>"
      color: "<bright><italic></italic>"
    muted-offline:
      name: "<muted><italic>Muted</italic>"
      color: "<muted><italic></italic>"
    online:
      name: "<#4ADE80>Online"
      color: "<#4ADE80>"
    offline:
      name: "<muted>Offline"
      color: "<muted>"

  # Confidence tiers shown next to the score.
  # CONFIRMED is 90+, LIKELY 75-89, POSSIBLE 50-74, WEAK below 50.
  tier:
    confirmed: "<main>✗ <middle>Confirmed"
    likely: "<main>Likely"
    possible: "<#FBBF24>⚑ <middle>Possible"
    weak: "<muted>Weak"
    trusted-group: "<#4ADE80>Trusted"
    unscored: "<muted>Unscored"

  # Output of /alts debug. <first>, <second>, <score>, <tier>, <display>, <link>,
  # <alert> and <enforce> placeholders where they make sense.
  debug:
    header: "<muted><strikethrough>--------------------------------------------------</strikethrough>"
    title: "<bright>Alt score: <first> <muted>vs <second>"
    total: "<bright>Total: <#4ADE80><score>% <muted>(<tier><muted>)"
    same-account: "<main>✗ <middle>That is the same account twice."
    no-evidence: "<muted>No evidence of any kind connects these accounts."

    # One line per signal. <signal>, <points> and <detail> placeholders.
    signal: " <#FBBF24>● <bright><signal>: <#4ADE80><points> <muted>(<detail><muted>)"
    thresholds: "<bright>Thresholds: <muted>display <bright><display> <muted>| link <bright><link> <muted>| alert <bright><alert> <muted>| enforce <bright><enforce>"
    verdict-enforce: "<main>✗ <middle>Above enforce - ban evasion through this pair is punished automatically."
    verdict-alert: "<#FBBF24>Alerts staff when one side evades a punishment, but never kicks automatically."
    verdict-display: "<muted>Shown in /alts, nothing more."
    verdict-none: "<muted>Below every threshold - these accounts are not linked."

  # Output of /alts address. <player>, <accounts>, <classification>, <firstSeen>,
  # <lastSeen>, <isp> and <sharedAt> placeholders where they make sense.
  address:
    no-address: "<main>✗ <middle><player> <middle>has no known address."
    header: "<muted><strikethrough>--------------------------------------------------</strikethrough>"
    title: "<bright>Address stats for <player><bright>'s current address:"
    accounts: " <#FBBF24>● <bright>Accounts seen: <#4ADE80><accounts>"
    classification: " <#FBBF24>● <bright>Classification: <#4ADE80><classification>"
    first-seen: " <#FBBF24>● <bright>First seen: <#4ADE80><firstSeen>"
    last-seen: " <#FBBF24>● <bright>Last seen: <#4ADE80><lastSeen>"
    vpn-flag: " <#FBBF24>● <main>Known VPN exit"
    mobile-flag: " <#FBBF24>● <#FBBF24>Mobile carrier network"
    isp: " <#FBBF24>● <bright>ISP: <#4ADE80><isp>"
    footnote: "<muted>The classification is worked out from how many accounts share this address."
    forced-shared: "<#4ADE80>✓ <middle>Pinned as shared - accounts on it will barely count as alt evidence."
    forced-trusted: "<#4ADE80>✓ <middle>Pinned as trusted - full evidence weight regardless of density."
    cleared: "<#4ADE80>✓ <middle>Override cleared - the classification recomputes from density again."

  # Shown to the punisher after banning someone with likely alt accounts.
  ban-notice:
    header: "<#FBBF24><player> <#FBBF24>has <amount> likely alt(s) - consider checking them:"
    entry: " <#FBBF24>● <player> <muted>- <bright><score>% <muted>(<tier><muted>)"

  # Output of /alts suppressed. <player> on the empty line,
  # <name>, <score> and <tier> on each entry.
  suppressed-list:
    none: "<middle>Nothing is suppressed on <main><player><middle>."
    entry: " <#FBBF24>● <name> <muted>- <bright><score>% <muted>(<tier><muted>)"

  # Output of /alts trust, untrust and suppress. <first> and <second> placeholders.
  trust:
    trusted: "<#4ADE80>✓ <middle>The link between <first> <middle>and <second> <middle>is now trusted - it will never enforce, whatever it scores."
    untrusted: "<#4ADE80>✓ <middle>The link between <first> <middle>and <second> <middle>is active again."
    suppressed: "<#4ADE80>✓ <middle>The link between <first> <middle>and <second> <middle>is now suppressed - it is hidden and will never enforce. Use untrust to bring it back."


    - "<muted>[<#4ADE80>Online<muted>, Offline, <bright><italic>Muted</italic><muted> (<bright><italic>Online</italic><muted>/<italic>Offline</italic><muted>), <main>Banned<muted>, <secondary>Blacklisted<muted>]"

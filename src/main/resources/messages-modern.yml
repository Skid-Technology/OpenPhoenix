  voided-all: "<#4ADE80>✓ <middle>Done... Voided all currently active <type>."

  # Shown after a network-wide wipe. Worth keeping the wording explicit:
  # these delete the punishment type for every player, not for one of them.
  kicks-wiped: "<#4ADE80>✓ <middle>Deleted <bright><amount><middle> kicks <muted>(every player on the network)."
  warns-wiped: "<#4ADE80>✓ <middle>Deleted <bright><amount><middle> warns <muted>(every player on the network)."

  # Shown when a wipe is run without -confirm. These are the most destructive
  # commands in the plugin, so the prompt names the scope rather than implying it.
  wipe-confirm:
    - ""
    - "<gradient:#FF5F6D:#C81E4A><bold>HOLD ON</bold></gradient>"
    - "<middle>This deletes every <type> on record, for <underlined>every player on the network</underlined> -- not for one of them."
    - "<middle>It cannot be undone."
    - ""
    - "<muted>Run <bright><command> -confirm <muted>if that is what you meant."
    - ""
  higher-priority: "<main>✗ <middle>You cannot punish <bright><player><middle> because their priority is higher."
  lookup-invalid-id: "<main>✗ <middle>ID <bright>#<id> <middle>is invalid."
  voided: "<middle>You have voided punishment <secondary>#<id><middle> as <secondary><void_reason><middle>."
  punishment-duration-too-large: "<main>✗ <middle>You don't have permission to use such a long duration."
  invalid-duration: "<main>✗ <middle>You've provided an invalid duration."
  punishment-executed: "<silent><#4ADE80>✓ <middle>You have <type> <player> <middle>for <main><reason><middle>."
  silent: "<rail>(Silent) "

  # Asked of the staff member when a punishment needs evidence and has none.
  proof-prompt: "<#FBBF24>⚑ <middle>Link the evidence for this <type><middle>, or type 'cancel' to stop."
  proof-cancelled: "<main>✗ <middle>No evidence given, so nothing was issued."
  blacklist:
